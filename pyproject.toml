[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-selector-v2"
version = "0.1.0"
description = "Unified and testable A-share screening pipeline"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "mootdx>=0.11", "PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stock-selector = "stock_selector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
