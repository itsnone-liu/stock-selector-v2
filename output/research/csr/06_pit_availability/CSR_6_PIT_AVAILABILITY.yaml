headline_findings:
  1: |
    实时识别结构（对源方案 §21 北极星问题的可用性回答）：T+1 实时证据池=
    两融（市场+个股）/大宗/龙虎榜/ETF 份额（市场+行业）+全部本地构造类
    ——但这些里 A/B 级直接资金证据只有四类，且龙虎榜与两融个股均带
    选择机制（上榜规则/标的池）。ownership 类直接证据（户数/十大股东/
    基金持仓）全部 LAGGED_VERIFICATION（滞后约 15 个工作日至 4 个月，
    视披露类型而定——基金季报前十大最快，上市公司年报口径股东结构最长）。
  2: |
    由此得出 CSR 的核心结构性结论：实时层可以确认离散资金行为、交易
    参与或未来供给事件（大宗一笔成交/龙虎榜上榜席位/减持预披露/ETF
    申赎/两融余额），但无法仅凭现有公开制度实时确认 A5 的持续
    lifecycle/ownership state——D1/D2 以及需要持仓路径支持的 D7/D8 的
    actor-confirmation，主要依赖 ownership 披露（滞后到达），因而只能
    事后验证。ownership/holding verification 的披露延迟约从 15 个工作日
    （公募季报前十大）至 4 个月（上市公司年报口径股东结构）不等，均非
    T/T+1 信息。"实时确认一笔资金行为"≠"实时确认主导资金状态"——
    这不是数据建设可消除的缺口，是披露制度本身的节律；宣称实时识别
    "主力状态"的方案，必然退化为 C 级代理堆叠（G-VAR 第二问直接命中）。
  3: |
    事前已知类（解禁日程/减持预披露、回购方案公告、E-MKT-06 中的
    未来增持计划字段）构成 EVENT_ADVANCE 层——它们不识别主体，但管理
    "未来供给/需求与流通盘变化窗口"（回购与未来增持是需求侧/供给收缩
    而非供给压力），是真正 lead-forward 的信息；注意其中混合着
    "已发生行为披露"（REALTIME_T1）与"事后确认"中间形态——减持实施
    结果通常在计划实施完毕或期间届满后 2 个交易日内披露（短期事后
    确认），回购实施进度则按月度/阶段公告流披露（阶段性事后确认）；
    两者均介于 REALTIME_T1 与 LAGGED_VERIFICATION 之间，不新增主
    realtime 枚举档，而由 realtime_components.latency 精确记录，
    逐字段区分不得整类混同。
  4: |
    BACKTEST_ONLY 四条：E-MKT-05 北向日频段（制度终止）、E-MKT-04/
    E-SEC-04（市值 reference 未补——补齐后重评级，不冒充当前可用）、
    E-MRG-05（冻结产物只读，不进任何实时管道）。
  5: |
    修订风险主源已定位：股本变更史（市值类）、定期报告更正（持仓类）、
    规则变更序列（龙虎榜/两融池）——三者全部进 CSR-6 契约项清单，
    抓取时必须按公告日对齐，禁止用当前规则回溯解释历史。
  6: |
    无 E_UNAVAILABLE——但 E-MKT-05 现行段（D_WEAK_PROXY）实质是
    "个股层日频北向归因已不可得"的制度性 UNOBSERVABLE，按源方案 §18
    如实记录为正式结论，不拼接代理补齐。

