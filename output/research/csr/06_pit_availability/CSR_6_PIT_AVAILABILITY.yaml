# CSR-6 PIT / AVAILABILITY AUDIT (v1.0)
# 职责（源方案 §9/§10 + 用户 CSR-5 冻结指示）：不再问"有没有数据"——逐
# evidence 正式裁决 observation_date → publication_date → available_date，
# latency / revision_risk / selection bias / regime break 落进数据契约，
# 并给出 A-E 可用性终裁。
meta:
  stage: csr_6
  frozen_inputs: ['CSR-0..4 FROZEN @ 956d679', 'CSR-5 FROZEN @ 4a2da12 (含 smoke 附录)']
  audit_type: desk_audit   # 制度规则级裁决；未抓数据未算指标未判 H01-H06
  two_scales_declaration: |
    两套字母必须严格区分，禁止混用：
    - evidence_level（CSR-4，A/B/C）= 证据离资金主体的距离（直接/筹码/量价代理）
    - availability_rating（本轮，A-E）= 数据性质与可得性（A=DIRECT_PIT 直接披露/
      B=DIRECT_DELAYED 直接披露但延迟/C=RELIABLE_PROXY 可靠代理/D=WEAK_PROXY/
      E=UNAVAILABLE）——评级反映数据性质，"快不快"由 realtime 单独表达；
      本地构造类无论多快都只是代理，不得因实时性升入 A/B
    例：E-STK-10 筹码构造 evidence_level=C（代理）且 availability=C_RELIABLE_PROXY
    （本地构造=代理性质），但 realtime=REALTIME_T1（快）；
    E-STK-02 十大股东 evidence_level=A（直接）但 availability=B（季频+延迟）。
  calendar_conventions:
    observation_date: 观测基准日（数据所描述的事实发生/存在的时点，如季末持仓基准日）
    publication_date: 披露日（数据进入公开域的时点）
    available_date: 可用日（研究/决策可安全引用的时点=披露日+渠道整理延迟）
    decision_rule: 实时研究只能使用 available_date <= decision_date 的信息（源方案 §9）
    disclosure_windows: '定期报告法定披露窗：季报报告期结束后 1 个月内、半年报 2 个月内、
      年报 4 个月内——available_date 以实际披露公告日为准，窗口仅是上界'
  rating_scale:
    A_DIRECT_PIT: 直接披露（官方一手），决策时点（T 日盘后~T+1）可用
    B_DIRECT_DELAYED: 直接披露但延迟到达（工作日至数月不等）——实时不可用，事后验证可用
    C_RELIABLE_PROXY: 本地构造代理（数据性质=代理）——时效由 realtime 表达，不因此升入 A/B
    D_WEAK_PROXY: 现行制度下时效或覆盖严重受限，仅辅助/历史段
    E_UNAVAILABLE: 现实不可可靠获取
  realtime_identification_scale:
    REALTIME_T1: 决策日 T+1 内可用（进入实时 candidate_state 证据池）
    EVENT_ADVANCE: 事前已知（日程/预披露——进入事前风险窗口管理）
    LAGGED_VERIFICATION: 滞后到达（1-3 月）——只能做事后 actor 验证与案例研究，
      不得进入实时状态判定
    BACKTEST_ONLY: 仅历史段可用（制度断点后失效）

verdicts:
  # ---------- MARKET ----------
  - evidence_id: E-MKT-01
    availability_rating: A_DIRECT_PIT
    realtime: REALTIME_T1
    observation_date_rule: T 日日终份额（申赎清算后确定）
    publication_date_rule: 交易所 T+1 晨间发布 T 日数据（smoke 实测：T 晚 21:00 未出）
    available_date_rule: publication +0（官方文件即最终）
    latency: T+1
    revision_risk: 低（份额为清算事实；罕见次日更正，登记不阻塞）
    selection_coverage_note: 份额≠规模（净值变动不改变份额）——资金流解释须用份额Δ而非规模Δ
  - evidence_id: E-MKT-02
    availability_rating: A_DIRECT_PIT
    realtime: REALTIME_T1
    observation_date_rule: T 日日终两融余额
    publication_date_rule: 交易所 T+1 晨间披露 T 日数据
    available_date_rule: publication +0
    latency: T+1
    revision_risk: 低（日终清算事实，基本无修订）
