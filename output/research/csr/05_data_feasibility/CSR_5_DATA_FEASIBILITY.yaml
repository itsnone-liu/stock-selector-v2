headline_findings:
  1: 'build_class 三分：EXISTING_ASSET_CONSTRUCTIBLE 9 条（E-MRG-01..04+E-MKT-03/E-SEC-02/E-SEC-03/E-STK-10 共 8 条可计算——本地字段已实测核过；E-MRG-05 冻结只读不计工程量）；NEW_EXTERNAL_CHANNEL 15 条（13 官方披露+1 第三方整理[E-STK-09]+2 条仅缺历史市值 reference 子类[E-MKT-04/E-SEC-04]——市值缺口已实测确认：baostock 逐股 9 字段无 totalValue/floatValue）；BROKEN_OR_STRUCTURAL_LIMIT 1 条（E-MKT-05）'
  2: 'E-MKT-05 北向两处结构断点：2016-12-05 深港通启动（此前沪股通-only，总量不可与双市场段做水平比较）+ 2024-08-19 披露机制调整（日频净买入中断）——CSR-6 须登记两个断点日，三段互不可拼接'
  3: '日频资金证据只有四类：两融/大宗/龙虎榜/ETF 份额——披露型 STOCK 证据主体是季频+延迟（户数/十大股东/基金持仓），CSR-6 的三日期口径审计将决定这些证据能否用于任何近实时解释'
  4: '行业 ETF 份额的深度不足（2019 前稀疏）限制行业层检验的时间窗口'
  5: '龙虎榜样本天然有偏（上榜规则=选择机制）——任何使用它的统计必须声明选择偏倚，不得外推全市场'
  6: '本轮为渠道级桌面审计（未写任何抓取器/未落任何数据，符合先审后抓）；接口级 smoke（tushare/akshare）见 CSR_5_SMOKE_ADDENDUM.md——不改变评级，只补充通道实测证据'

audit_order_note: |
  本文件不填 CSR-4 的 publication_delay/point_in_time/revision_risk/
  coverage（列级）/confidence 字段——那些是 CSR-6/CSR-9 的裁决。
  本轮 historical_depth/coverage 为渠道级量级描述（粗粒度、非逐列审计），
  CSR-6 时按数据契约精化。
