# CSR-5 DATA SOURCE FEASIBILITY AUDIT (v1.0)
# 纪律边界（用户指示）：只回答"拿不拿得到/历史覆盖/来源可信/成本"；
# 不计算指标、不判断 H01-H06 是否成立；PIT/available-date 三日期口径
# 与 latency 的终裁留给 CSR-6。
meta:
  stage: csr_5
  frozen_boundary: CSR-0..4 FROZEN @ 956d679
  audit_type: desk_audit   # 渠道级桌面审计：基于官方披露制度与交易所规则；未写抓取器、未落任何数据
  rating_scale:            # 本轮三值（A-E 完整评级含 PIT/延迟区分，归 CSR-6 终裁）
    OBTAINABLE: 渠道存在、历史可回溯、来源可信
    BROKEN_SERIES: 数据存在但披露制度变更导致序列断裂
    UNAVAILABLE: 现实不可可靠获取
  channel_trust:
    official: 交易所/巨潮/法定公告等一手披露（首选，本地存档原则）
    thirdparty_free: akshare 类免费聚合（已装 1.18.97，稳定性第三方——见 smoke 附录）
    thirdparty_paid: tushare 积分档/Wind（成本项，门槛以官方为准；当前 token 积分 0）
    constructed: 由现有行情数据本地构造（无新外部依赖）
    frozen_product: 已冻结研究产物只读引用（T6/T8，C5 防火墙——不可重算不可改写）
  build_class:
    EXISTING_ASSET_CONSTRUCTIBLE: 当前本地资产即可计算（已核字段，非"理论上可构造"）
    NEW_EXTERNAL_CHANNEL: 需新增数据通道（含仅需补 reference data 的子类）
    BROKEN_OR_STRUCTURAL_LIMIT: 数据存在但披露制度变更/结构断点限制使用

environment_finding:
  existing_stack: |
    现有研究栈（T3-T8）数据面=baostock 日 K 三源复权（5,241 股，逐股
    9 字段：date/OHLC/volume/amount/turn/pctChg——无市值字段）+
    csrc 行业快照。按 build_class 精确统计：MARGINAL 层 5 条中 4 条
    现有资产直接可构造、1 条已冻结；非 MARGINAL 20 条中 4 条现有资产
    可构造（E-MKT-03/E-SEC-02/E-SEC-03/E-STK-10）、15 条需新通道
    （含 E-MKT-04/E-SEC-04 两条"仅缺历史市值 reference"子类——行情
    已在但市值序列缺失，baostock 抓取未含 totalValue/floatValue，
    已实测确认）、1 条制度断裂。
  installed_state: 'akshare 未安装；tushare 未安装（无 key）；baostock 0.9.40 在用'

