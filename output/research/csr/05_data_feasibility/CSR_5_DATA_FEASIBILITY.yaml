# CSR-5 DATA SOURCE FEASIBILITY AUDIT (v1.0)
# 纪律边界（用户指示）：只回答"拿不拿得到/历史覆盖/来源可信/成本"；
# 不计算指标、不判断 H01-H06 是否成立；PIT/available-date 三日期口径
# 与 latency 的终裁留给 CSR-6。
meta:
  stage: csr_5
  frozen_boundary: CSR-0..4 FROZEN @ 956d679
  audit_type: desk_audit   # 渠道级桌面审计：基于官方披露制度与交易所规则；未写抓取器、未落任何数据
  rating_scale:            # 本轮三值（A-E 完整评级含 PIT/延迟区分，归 CSR-6 终裁）
    OBTAINABLE: 渠道存在、历史可回溯、来源可信
    BROKEN_SERIES: 数据存在但披露制度变更导致序列断裂
    UNAVAILABLE: 现实不可可靠获取
  channel_trust:
    official: 交易所/巨潮/法定公告等一手披露（首选，本地存档原则）
    thirdparty_free: akshare 类免费聚合（未装、稳定性第三方）
    thirdparty_paid: tushare 积分档/Wind（成本项，门槛以官方为准）
    constructed: 由现有行情数据本地构造（无新外部依赖）

environment_finding:
  existing_stack: |
    现有研究栈（T3-T8）数据面=baostock 日 K 三源复权（5,241 股）+
    csrc 行业快照——100% 覆盖 MARGINAL 层（E-MRG-01..04 可直接构造，
    E-MRG-05 已冻结）。资金面证据（MARKET/SECTOR/STOCK 三层 20 条）
    全部缺位，需新建数据通道——这是 CSR 与 T3-T8 数据面的根本差异。
  installed_state: 'akshare 未安装；tushare 未安装（无 key）；baostock 0.9.40 在用'

