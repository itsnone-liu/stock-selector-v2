# CSR-7 CASE STUDY PROTOCOL (v1.0)
# 最高约束（用户 CSR-6 冻结时定稿）：案例研究可以检验"哪些实时 proxy
# 与后来 ownership confirmation 一致"，但不能因为事后确认成功，就把
# 当时不可见的信息倒灌回历史时点——每案例必须同时保留 real-time view
# 与 ex-post verification view 两套视角。
meta:
  stage: csr_7
  frozen_inputs:
    - 'CSR-0..4 FROZEN @ 956d679'
    - 'CSR-5 FROZEN @ 4a2da12（build_class/北向三段/smoke 附录）'
    - 'CSR-6 FROZEN @ b848ed0（三日期终裁/realtime 四档/mixed-event components）'
  audit_type: protocol_only   # 本段只立协议：不选案例、不标注、不落数据
  first_round_goal: 源方案 §12——检验资金理论能否解释完整生命周期，不是训练模型

dual_view_discipline:
  principle: '实时确认一笔资金行为 ≠ 实时确认主导资金状态（CSR-6 headline 2）'
  real_time_view:
    evidence_pool: 'CSR-6 realtime ∈ {REALTIME_T1, EVENT_ADVANCE} 的 evidence（available_date <= T）'
    output: 日级 candidate_state 判定（"与 Hxx/Dx 假说一致"表述，CSR-2 两层制下最高只到此层）
    forbidden: 引用任何 LAGGED_VERIFICATION/事后信息；引用 available_date > T 的任何字段
  ex_post_view:
    evidence_pool: 全量证据（ownership 披露到达后：户数/十大股东/基金持仓/减持实施/龙虎榜历史）
    output: actor-confirmed 事件与 lifecycle 重建（最终判定层）
    transition_semantics: |
      CSR-2 registered_candidate_transitions = 已登记参考路径，不是运行时白名单。
      案例观察到未登记转移：不得拒绝、不得强行改写为已登记路径——
      登记为 novel_transition + 记录 supporting evidence + 进入 CSR-9 review。
      （CSR-8 的任务之一就是发现 ontology 不完整处。）
    forbidden: '不得倒灌（reverse contamination）：ex_post 结论不得用于改写任何 T 时点的 real_time_view 记录'
  legal_direction: 'ex_post → real_time 的唯一合法用法=验证：统计 real-time 判定与事后确认的一致/不一致率（这是 CSR-7 的核心检验目标）'
  annotation_order: RT 与 XP 由不同 primary annotator 独立完成（见 annotation_blindness）；
    若条件所限同人执行，必须分独立 session 且 XP session 不可见 rt_* 标注记录——记录两 session 时间戳
  annotation_blindness: |
    主 endpoint 是 RT prediction vs XP reference——reference side 必须独立生成，否则同一
    标注者刚判完 rt_H01=SUPPORTED_PARTIAL 再开 XP，即使看不到字段也会 anchoring/confirmation。
    RT primary annotator：只做 RT（as-of-T blind packet + progressive sealing）。
    XP primary annotator：独立标注者（≥10% 案例另有第二 XP 标注者做 inter-rater audit）；
      可见完整原始证据（含历史行情——full-evidence reconstruction 需要它）；
      不可见任何 rt_* annotation / rt candidate_state / rt H-support——禁止的是看 RT 标注
      结果，不是禁止看原始数据。
    两标签独立生成后仅在分析层比较（RT↓ →比较← XP↑）。
  progressive_sealing: |
    整案例 rt 序列一次性锁定不足以防 hindsight——标注者可以看遍 T+1..T+60 后回改 T 再锁定，
    全程未触 xp 却已不是 real-time reconstruction。冻结为逐 T 锁定：
    生成 packet(T) → 标注 T → 写 timestamp + content hash → T 永久只读 → 才允许打开 packet(T+1)。
    不可逆时间旅行由 immutable event log 保证；G-CS-3 检查 sealed_at(T) < revealed_at(T+1) 全序成立。
  physical_separation: case sheet 中两视角字段物理分列（rt_*/xp_* 前缀），共享字段仅 opaque_case_id/案例窗口起点
  rt_blind_packet: |
    available_date<=T 不足以防 hindsight——group 标签/window_end/未来路径本身就是结局信息。
    RT 标注包必须是严格 as-of-T packet：
    - 不可见：group、selector outcome/metrics、window_end、T 之后的一切价格/成交/市场/
      行业数据、xp_* 字段、真实 stock_code/name（匿名化为 opaque_case_id）
    - 可见：仅 available_date <= T 的数据
    - 案例真实 group 与 selector metadata 存放 selector_only_hidden_block，
      整个 rt 序列锁定（时间戳+内容哈希）后方可解封
    - rt 标注界面的图表截断于 T（不得展示完整窗口曲线）

case_selection:
  sampling_frame: '冻结股票池（研究 universe 5,241 股）× 冻结研究窗（与 T3-T8 资产一致的全历史）'
  rule_style: 公式化分位数规则（预注册，避免绝对阈值与"挑好解释的案例"）；outcome-conditioned sampling 本身合法（案例研究即检验理论能否解释已知结局），但规则一旦冻结不得再调
  groups:
    - {group: G1_complete_bull, n: 20, rule: '区间最大涨幅在全池分位 ≥99.5% 且区间长度 ≥18 个月且回撤修复 ≤3 次'}
    - {group: G2_breakout_fail, n: 20, rule: '突破日（T3 冻结定义的 breakout 事件）后 120 日内回撤至突破位下方且未创新高'}
    - {group: G3_high_collapse, n: 20, rule: '区间高点后 180 日内回撤 ≥60%（高点前 12 个月涨幅分位 ≥90%）'}
    - {group: G4_quiet_then_go, n: 20, rule: '启动前 ≥24 个月年化波动分位 ≤20% 且换手分位 ≤30%，随后 12 个月涨幅分位 ≥85%'}
    - {group: G5_sector_follower, n: 20, rule: '板块行情（行业指数区间涨幅分位 ≥95%）中，个股涨幅位于行业 40-60 分位的普通跟随股', role: sector_follower_comparator}
  anchor_generation: |
    episode/anchor 生成算法（冻结——执行者不得在完整历史里自行挑选窗口）：
    - G1：episode=每股滚动窗口（起点≥上市后 6 个月，长度 18~60 个月）内区间最大涨幅最优窗口；
      一股多窗口取涨幅最大、并列取最早（每股至多 1 个 episode）；全池 episode 按该涨幅排序取分位 ≥99.5%
    - G2：anchor=T3 冻结 breakout 事件定义（确定性，无需另行生成）；episode=事件日起 120 个交易日；每事件 1 个 episode
    - G3：anchor 日=满足"前 12 个月涨幅分位 ≥90% 且其后 180 日回撤 ≥60%"的收盘高点；
      一股多高点取回撤最深、并列取最早；episode=anchor 前推 12 个月至后推 180 日
    - G4：低波动段=连续 ≥24 个月 rolling 年化波动分位 ≤20% 且换手分位 ≤30%；启动日=低波动段结束后
      12 个月内 20 日滚动涨幅首次达到当日全池截面分位 ≥85% 的首日；episode=低波动段起点至启动日后 12 个月
    - G5：行业行情 episode=本地构造 csrc 行业等权指数（等权日收益累积）滚动 120 日涨幅分位 ≥95% 的区间；
      连续重叠 qualifying 窗口合并为一段；每行业取分位最大 anchor（并列取最早）；
      个股=区间内涨幅位于行业内 40~60 分位；同股多行业 episode 取行业强度最高（并列取最早）
    多 episode 唯一化（同组同股至多 1 个，全部确定性可重放）：
      G2：同股多个 failed breakout → failure severity 最大（事件后 120 日内最大回撤最深），并列取最早
      G4：同股多个 quiet segment → 段后 12 个月涨幅最高，并列取最早
      G5：见上（行业强度最高，并列取最早）
  overlap_policy: |
    同组同股：按各组唯一化规则取 1 个 episode（上述）。
    跨组：允许 multi-group membership（同一股票先暴涨后崩塌可同时入 G1/G3）——登记 membership 全表；
    一致率分析必须报告 per-group 与 leave-shared-out（剔除跨组案例）两种口径（预注册）。
  tie_break: '候选 > n 时随机抽样（seed=20260925 预注册，与 t6 契约种子同源）；每组替补序列同种子生成，记录落选者'
  stratified_redraw: |
    分层重抽算法（冻结）：episode 按起始年份分桶（每年 1 桶）；quota=floor(n/桶数)，余数按组内
    规则指标值降序分配到桶；桶内不足额→从最多桶按指标排名补足。触发条件：抽中样本单一年份
    占比 >50%。重抽至多 1 次，仍超则如实登记（不隐藏结构事实）。'

case_sheet_schema:
  identity: [opaque_case_id, window_start]   # rt 标注者可见层
  identity_hidden: [real_stock_code, group, selector_metrics, window_end, selector_rule_version]  # hidden block，rt 锁定后解封
  market_block:  {fields: [rt_market_state_daily, xp_market_narrative], evidence_refs: [E-MKT-01..06]}
  sector_block:  {fields: [rt_sector_state_daily, xp_sector_narrative], evidence_refs: [E-SEC-01..04]}
  stock_block:   {fields: [rt_stock_observables_daily], evidence_refs: [E-STK-10, E-MRG-01..04]}
  direct_block:  {fields: [rt_direct_events, xp_ownership_trajectory], evidence_refs: [E-STK-01..09]}
  hypothesis_block:
    fields: [rt_observability_H01..H06, xp_observability_H01..H06, rt_h_support_H01..H06, xp_h_support_H01..H06]   # 物理分列，无覆盖性 h_support 字段
    observability: |
      正交字段（先判，按 H 逐列）：OBSERVABLE | UNOBSERVABLE。
      一个案例不同 H 的可得性完全不同（CSR-6 已证明各 H 依赖的 ownership evidence
      可得性各异——案例级单一 observability 会错误屏蔽/放行其他 H）。
      OBSERVABLE_Hx=该时点/该 H 依赖证据维度的数据制度能给答案；仅 OBSERVABLE 才填写该列五档 support。
      UNOBSERVABLE_Hx=数据制度无法给该 H 答案（数据缺席≠反证，CSR 一贯原则）——该列 support 留空。
    scale: 5 档预注册（仅 OBSERVABLE 时填写）——
      SUPPORTED_STRONG（机制+≥2 独立证据层一致且无反证）
      SUPPORTED_PARTIAL（机制+≥1 证据层一致，反证弱）
      MIXED（证据层冲突）
      NOT_OBSERVED（可观测但预期观测未出现——有数据后的阴性结果，≠ UNOBSERVABLE）
      CONTRADICTED（反证占优）
    rule: 评分必须先 rt 后 xp 两遍独立给出；两层字段并列保留，不存在"最终层覆盖"——
      CSR-9 汇总以 xp 层为 actor 视角、rt 层为可用性视角，两列同时报告；
      UNOBSERVABLE 是 CSR-9 合法结论的直接入口
  counter_evidence_block: [registered_alternatives, searched_counterexamples]
  lifecycle_annotation:
    rt_layer: |
      日级 candidate_state 序列（D0/D1/D2/D4/D5/D6/D7/D8）——D3 不在 RT candidate 分类器
      输出集合内（D3 无 H01-H06 独立机制假说，CSR-2 冻结 CSR-8 前不得建立 D3 识别器；
      "retrospective marker"不能同时是 real-time candidate state）
    xp_layer_descriptive: |
      XP/描述层允许记录 D3-like 回溯现象标记：必须标 ONTOLOGY_ONLY；不进入 H 支持
      度、不进入 RT↔XP concordance、不作为 actor-confirmation
    xp_layer: |
      actor-confirmed 事件与转移；CSR-2 registered_candidate_transitions 仅作参考——
      未登记路径登记 novel_transition（不拒绝、不改写），带 supporting evidence 进 CSR-9
  gates_on_sheet: [G-H-1..6 的案例级勾稽]

analysis_plan:
  primary_question: |
    RT×XP 混淆矩阵（按 H×组分格报告，不先压成单一 accuracy 数字）：
    rt_candidate_positive   = rt_h_support ∈ {SUPPORTED_STRONG, SUPPORTED_PARTIAL}
    rt_candidate_negative   = rt_h_support = CONTRADICTED
    rt_mixed                = rt_h_support = MIXED
    rt_unobservable(Hx)     = rt_observability_Hx = UNOBSERVABLE（≠ NOT_OBSERVED 档；逐 H 列判定）
    xp_confirmed_positive   = xp actor-confirmed 事件存在 且 xp_h_support ∈ {SUPPORTED_STRONG, SUPPORTED_PARTIAL}
    xp_not_confirmed        = xp_h_support = CONTRADICTED 或证据明确不支持（≠数据缺失）
    xp_unobservable(Hx)     = xp_observability_Hx = UNOBSERVABLE（ownership 证据缺失/不可判；数据缺席≠证伪）
    agreement_mapping: |
      二元 agreement（冻结，不再"若报告则按预注册映射"——映射即本块）：
        agreement格:     rt_candidate_positive × xp_confirmed_positive；
                         rt_candidate_negative × xp_not_confirmed
        disagreement格:  rt_candidate_positive × xp_not_confirmed；
                         rt_candidate_negative × xp_confirmed_positive
        excluded_from_binary_agreement: rt_mixed；rt=NOT_OBSERVED 档；rt 或 xp 任一 UNOBSERVABLE
      binary_agreement_rate = agreement格 / (agreement格+disagreement格)；
      excluded 各类单独报告 exclusion rate（本身是 PIT 结论的一部分）。
      主结果仍是完整 confusion matrix（含全部格计数），二元 rate 只是派生指标之一。
    解释边界（冻结声明）：本样本为 outcome-conditioned five-strata 抽样——agreement 只能解释为
    "conditional agreement within these five case strata"，禁止表述为全市场识别准确率。'
  secondary:
    - '五组 lifecycle 路径分布差异（转移序列的描述性对比；含 novel_transition 登记）'
    - '每 H 的 SUPPORTED/CONTRADICTED 计数（CSR-9 输入）'
    - 'G5 sector-follower comparator：其 xp actor-confirmation 率与 D0 占比是否与其他组不同——
      "无 A5"只能是 CSR-8/9 的结果，禁止作为抽样标签预设（latent-state 原则：普通跟随股
      照样可能存在长期 A5，只是未表现为极端价格位移）'
  allowed_methods: [descriptive_statistics, cross_tab, sequence_description, case_narrative]
  forbidden: [ML, feature_selection, return_optimization, threshold_search, policy_backtest, '把案例评分当策略参数']

gates:
  G-CS-1_dual_view_separation: |
    case sheet 两视角物理分列；rt_* 字段不得出现在 xp 计算依赖里（结构检查）。
    annotation blindness contract：XP primary 不可见任何 rt_* 标注结果
    （独立标注者或独立 session+时间戳）；比较只发生在分析层
  G-CS-2_selection_replayable: '抽样规则+种子冻结，重放得同一样本集'
  G-CS-3_no_reverse_contamination: |
    hindsight 禁令：任何 rt_ 判定引用 xp_ 信息即 FAIL；标注顺序时间戳可审计。
    RT 标注包必须是 as-of-T blind packet——group/window_end/future path/真实代码不可见，
    selector metadata 锁于 hidden block 至 rt 序列锁定。
    逐 T 锁定全序检查：sealed_at(T) < revealed_at(T+1) 对全部 T 成立（immutable event log），
    违反即 FAIL——防止"看遍 T+1..T+60 后回改 T"。
  G-CS-4_group_balance: '五组各 20、替补与落选记录完整、分层重抽规则被执行情况登记'
  G-CS-5_annotation_consistency: |
    抽 ≥10% 案例双标注：rt 层第二标注者盲标（blind packet 同规则）；
    xp 层第二标注者看完整 xp evidence 但盲于第一标注者的 rt/xp 标签——
    reference side 的人工不确定性同样必须量化。分别报告 rt / xp inter-rater
    disagreement（分歧率报告，不强制一致；分歧案例进入 CSR-9 仲裁清单）
  G-H_gates_apply: 'CSR-3 的 G-H-1..6 在每案例勾稽；G-H-4（反例主动搜索）与 G-H-6（跨年份/行业/市值）在案例层落地'

stopping_and_handoff:
  after_csr_7: 'CSR-8 Pilot Cases 按 20×5 执行（100 案例）；CSR-9 Hypothesis Review 汇总五档计数——UNOBSERVABLE 为合法结论'
  no_policy: 'CSR-9 之前禁止产生交易策略（源方案 §13/§17）'
