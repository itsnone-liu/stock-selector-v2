paths:
  tdx_dir: /root/tdx_data
  output_dir: output
  state_dir: state
  names_file: /root/.hermes/hermes-agent/stock_names.json

universe:
  include_sh: true
  include_sz: true
  include_bj: true
  include_b_share: false
  exclude_st: true
  exclude_delisting: true
  min_listing_days: 120
  min_median_amount_20d: 20000000

monthly:
  min_bars: 20
  require_ma_bull: true
  max_last_month_drop_pct: 8.0

weekly:
  min_bars: 35
  allow_ma_bull: true
  allow_macd_cross: true
  allow_macd_stabilizing: true
  macd_gap_pct: 0.8

surge:
  allow_reversal: true
  allow_dual_yang: true
  require_current_week_up_vs_prev_close: true
  min_projected_volume_ratio: 0.8
  bearish_turnover_veto_ratio: 1.5
  bearish_turnover_lookback: 4
  efficiency_improvement_ratio: 1.0
  return_projection: none

buy:
  pullback_change_min_pct: -3.0
  pullback_change_max_pct: 2.0
  ma_tolerance_pct: 1.0
  acceleration_max_change_pct: 3.5
  realtime_volume_mode: same_time
  allow_projected_volume_fallback: true
  # 基础分按2026-09-15历史评估偏移：两日加速最强(+1.02%/5d)上调，
  # 回踩不破最弱(+0.28%/5d)下调；样本仅一年，存在过拟合风险，如失效应回退30/25/25。
  base_scores:
    pullback_holds: 26.0
    shrinking_volume_acceleration: 25.0
    two_day_acceleration: 30.0

bottom_volume:
  # 底部三倍量大涨事件（日线形态版，2026-09-15与用户确认）
  min_volume_multiple: 3.0        # 当日量/前5日均量
  quiet_volume_ratio: 1.3         # 前5日均量/前60日均量上限（启动前必须安静）
  min_change_pct: 6.0             # 当日涨幅下限
  max_drawdown_pct: -30.0         # 收盘相对250日最高回撤下限
  platform_tolerance_pct: 15.0    # 收盘高于60日最低点的上限（低位平台）
  prelaunch_min_pct: -20.0        # 信号前20日累计涨幅下限
  prelaunch_max_pct: 15.0         # 上限（排除已启动）
  close_position_min: 0.6         # 收盘位于当日振幅上沿比例
  lookback_high: 250
  lookback_low: 60
  min_bars: 260
  expiry_trading_days: 60         # 池内保留期（转化时滞p75≈40，全部≤60）


freshness:
  max_daily_data_business_day_lag: 5
  max_quote_age_seconds: 180
  reject_future_daily_bar: true

calendar:
  # 交易所休市日应按年份维护；用于周内成交量进度，不用于猜测价格。
  holidays: []

realtime:
  provider: tencent
  timeout_seconds: 15
  batch_size: 50
  benchmark_minutes_per_day: 240
  tencent_volume_unit: hand
  canonical_volume_unit: share

output:
  encoding: utf-8-sig
  atomic_write: true
  save_rejections: true
  save_diagnostics: true

decision:
  weekly_trend_policy: hard_gate  # hard_gate | feature_only | off（滚动验证未裁决硬门槛价值，须可实验）
  execution:
    model_version: cn-a-share-eod-v1
    commission_rate: 0.0003
    minimum_commission: 5.0
    slippage_bps: 5.0
    transfer_fee_rate: 0.00001
    stamp_tax_schedule: cn-sell-20230828-v1
  # 决策层（蓝图 docs/DECISION_SYSTEM_BLUEPRINT.md）。数值默认为工程缺省，
  # 标注 research 的项需回放+样本外验证后才可晋升为生产规则。
  weekly_momentum_mode: revised_weekday   # revised_weekday | unified | legacy_weekday
  index:
    market: sh
    code: "000001"        # 上证指数：regime 用
  portfolio:
    single_max_pct: 20    # 单票上限（占组合净值）
    industry_max_pct: 40  # 行业暴露上限
    daily_add_max_pct: 30 # 单日新增敞口上限
  exits:
    time_stop_days: 5
    trail_pct: 8.0        # E3 收盘峰值回撤比例
    max_hold_days: 20
  checkpoints:
    - "10:00"
    - "14:00"
    - "14:45"             # 主决策
    - "15:05"             # 盘后复核
